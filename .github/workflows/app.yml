name: app

# Compile-checks the SwiftUI app on a GitHub macOS runner and uploads a universal
# (Apple Silicon + Intel), ad-hoc signed ΨLab.app as a downloadable artifact.
# The Xcode project is generated from xcode/project.yml with XcodeGen.

on:
  push:
    paths:
      - "app/**"
      - "backend/**"
      - "third_party/**"
      - "xcode/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "backend/**"
      - "third_party/**"
      - "xcode/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

jobs:
  build-app:
    runs-on: macos-26
    permissions:
      contents: write   # the release step (push to main only)
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd xcode
          xcodegen generate --spec project.yml

      - name: Build (universal, Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project xcode/PsiLab.xcodeproj \
            -scheme PsiLab \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/app" \
            build 2>&1 | tee build.log

      - name: Print compiler errors and warnings
        if: always()
        run: |
          grep -E "error:|warning:" build.log | sort -u | head -n 200 || true

      - name: Inspect the app bundle
        run: |
          lipo -archs "build/app/ΨLab.app/Contents/MacOS/ΨLab"
          codesign -dv --entitlements - "build/app/ΨLab.app" 2>&1 | head -n 30
          # The basis-set files must be inside the bundle (Contents/Resources/basis).
          ls -l "build/app/ΨLab.app/Contents/Resources/basis"
          test -f "build/app/ΨLab.app/Contents/Resources/basis/aug-cc-pcv5z.gbs"

      - name: Package
        run: ditto -c -k --keepParent "build/app/ΨLab.app" "ΨLab.app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ΨLab-app
          path: ΨLab.app.zip

      # Every build of main is published as a GitHub Release, one release per app version
      # (tag v<MARKETING_VERSION>, asset PsiLab-<version>.app.zip): artifacts are deleted after
      # 90 days, releases stay. A later build of the same version replaces the asset and moves
      # the tag to its commit.
      - name: Publish the app as a GitHub Release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' xcode/project.yml)
          test -n "$VERSION"
          TAG="v$VERSION"
          ASSET="PsiLab-$VERSION.app.zip"
          cp "ΨLab.app.zip" "$ASSET"
          NOTES="ΨLab $VERSION for macOS 14 and later (Apple Silicon and Intel), built from $GITHUB_SHA by run $GITHUB_RUN_ID. Unzip $ASSET; the app is not notarized: right-click ΨLab.app ▸ Open the first time, or run xattr -dr com.apple.quarantine ΨLab.app. What is new: README, section Versions."
          if gh release view "$TAG" > /dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "ΨLab $VERSION" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "ΨLab $VERSION" --notes "$NOTES" --latest
          fi
          echo "Release: $(gh release view "$TAG" --json url --jq .url)"

      # Launch the app on the runner, screenshot each tab and dump the visible text.
      # Evidence only: this step never fails the job (accessibility / screen-recording
      # permissions on the runner decide how much it can see).
      - name: UI smoke test (launch, screenshots, tab text, menus)
        continue-on-error: true
        timeout-minutes: 40
        run: bash xcode/ci/ui_smoke.sh "build/app/ΨLab.app" ui-smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke
          path: ui-smoke
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
