name: backend

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the large RHF, Full CI and gradient cases (up to 341 basis functions / 11 million determinants, about 1.5 h)"
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install NumPy (needed by the reference script)
        run: python3 -m pip install numpy

      - name: Expected reports match the reference script
        run: |
          python3 backend/tests/gen_expected.py
          git diff --exit-code -- backend/tests/data

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Terminal version, general molecule
        run: |
          printf 'molecule = H2O\nbasis = aug-cc-pVDZ\nR = 0.9572 angstrom\nangle = 104.52\n' > h2o.inp
          ./build/psilab h2o.inp h2o.out
          head -n 20 h2o.out
          ./build/psilab --estimate h2o.inp
          printf 'molecule = LiH\nbasis = aug-cc-pVDZ\nmethod = FCI\n' > lih.inp
          ./build/psilab lih.inp lih.out
          head -n 25 lih.out
          printf 'molecule = H2O\nmethod = FCI\n' > h2o-fci.inp
          if ./build/psilab h2o-fci.inp; then echo "Full CI for H2O must be refused"; exit 1; fi

  # Recomputes the stored reference values with PySCF (an independent program), so the
  # numbers the C++ tests compare with are reproducible.
  pyscf-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PySCF and geomeTRIC
        run: python3 -m pip install pyscf geometric

      - name: Integral invariants (S, T, V, ERI; l up to 5)
        run: python3 reference/pyscf_integral_reference.py --check

      - name: RHF energies (cases with up to 110 basis functions)
        run: python3 reference/pyscf_rhf_reference.py --check --max-nbf 110

      - name: Full CI energies (H2 up to aug-cc-pVQZ, LiH aug-cc-pVDZ)
        run: python3 reference/pyscf_fci_reference.py --check --max-det 300000 --max-orbitals 100

      - name: Coupled-cluster diagrams (signs against brute-force coupled cluster)
        run: python3 backend/tools/cc_diagrams.py --check

      - name: CCSD and CCSD(T) energies (H2, LiH, H2O)
        run: python3 reference/pyscf_cc_reference.py --check

      - name: RHF gradients, Hessians and dipole moments (cases up to 110 basis functions)
        run: python3 reference/pyscf_gradient_reference.py --check --max-nbf 110

      - name: CCSD, CCSD(T) and Full CI gradients (H2, LiH, H2O)
        run: python3 reference/pyscf_correlated_gradient_reference.py --check

      - name: Optimised geometries (PySCF gradients + geomeTRIC)
        run: >
          python3 reference/pyscf_optimization_reference.py --check --only
          H2O/aug-cc-pVDZ/RHF H2O/aug-cc-pVDZ/CCSD "H2O/aug-cc-pVDZ/CCSD(T)" LiH/aug-cc-pVDZ/RHF
          "LiH/aug-cc-pVDZ/CCSD(T)" H2/aug-cc-pVTZ/FCI

  # On request only: every RHF reference case, including H2O/aug-cc-pCV5Z (341 functions), and
  # every Full CI case, including LiH/aug-cc-pCVTZ (11 million determinants).
  rhf-full:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target macqc_rhf_tests macqc_fci_tests macqc_gradient_tests macqc_correlated_gradient_tests

      - name: All RHF cases against PySCF
        env:
          PSILAB_TEST_MAX_NBF: "400"
          PSILAB_BASIS_DIR: ${{ github.workspace }}/basis
        run: ./build/macqc_rhf_tests

      - name: All Full CI cases against PySCF
        env:
          PSILAB_TEST_MAX_DET: "2e7"
          PSILAB_BASIS_DIR: ${{ github.workspace }}/basis
        run: ./build/macqc_fci_tests

      - name: All gradient and Hessian cases (finite differences, PySCF up to aug-cc-pV5Z)
        env:
          PSILAB_TEST_MAX_NBF: "400"
          PSILAB_BASIS_DIR: ${{ github.workspace }}/basis
        run: ./build/macqc_gradient_tests

      - name: Correlated gradients, triple-zeta cases
        env:
          PSILAB_TEST_MAX_NBF: "400"
          PSILAB_BASIS_DIR: ${{ github.workspace }}/basis
        run: ./build/macqc_correlated_gradient_tests
